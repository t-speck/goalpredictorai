.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px}

.bn{font-weight:700;font-size:21px;line-height:1.1;letter-spacing:-.4px}.bs{color:var(--cyan);font-weight:600;font-size:10.5px;letter-spacing:2.5px;margin-top:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;width:100%}
.proof{margin-top:20px;padding:18px 18px 16px;display:block;transition:transform .15s,border-color .2s}.proof:active,.row:active,.feat:active{transform:scale(.985)}
.pr{display:flex;justify-content:space-between;align-items:center}
.big{font-weight:700;font-size:64px;line-height:.95;letter-spacing:-2px}.big small{color:var(--mut);font-size:64px}
.bl{font-weight:700;font-size:13px;letter-spacing:1.2px;margin-top:6px}
.hr{text-align:right}.hr .n{font-size:52px;font-weight:700;line-height:1;color:var(--cyan);text-shadow:0 0 22px #68E1FF77}.hr .n span{font-size:26px;color:var(--mut)}
.hr .t{color:var(--mut);font-size:10.5px;letter-spacing:2px;font-weight:600;margin-top:4px}
.sqs{display:flex;gap:6px;margin-top:16px}.sq{flex:1;height:24px;border-radius:6px}.sq.w{background:#5AD08A;box-shadow:0 0 10px -2px #5AD08A}.sq.l{background:#FF6A4D;box-shadow:0 0 10px -2px #FF6A4D}
.hint{color:var(--mut);font-size:10px;letter-spacing:1px;text-align:center;margin-top:10px}
.title{text-align:center;margin-top:26px}.title h1{font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.2}.title .d{color:var(--cyan);font-size:15px;font-weight:700;letter-spacing:3px;margin-top:4px}
.feat{display:block;margin-top:18px;padding:18px;border-radius:20px;transition:transform .15s}
.badge{display:inline-block;color:#04121F;font-weight:700;font-size:10px;letter-spacing:1.6px;padding:4px 10px;border-radius:6px}
.ft{display:flex;gap:8px;align-items:baseline;margin-top:12px;font-weight:700;font-size:25px;letter-spacing:-.5px;line-height:1.15;flex-wrap:wrap}.ft em{font-style:normal;color:var(--mut);font-size:12px;font-weight:500}
.fm{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.tag{color:var(--mut);font-size:9.5px;letter-spacing:1.6px;font-weight:600}.fpick{font-weight:700;font-size:18px;margin-top:2px}
.fpct{font-weight:700;font-size:78px;line-height:1;letter-spacing:-4px;margin-top:2px}.flab{font-weight:700;font-size:12px;letter-spacing:2px}
.fris{text-align:right;background:#0d1a2c;border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex:none}
.frv{font-weight:700;font-size:38px;color:var(--cyan);text-shadow:0 0 16px #68E1FF77;line-height:1.1}
.bar{height:7px;border-radius:5px;background:#1b3049;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}

.fs b{display:block;font-size:17px}.fs small{color:var(--mut);font-size:7.5px;letter-spacing:.8px;font-weight:600}
.tap{display:block;text-align:center;color:var(--mut);font-size:10px;letter-spacing:1px;margin-top:10px}
.sec{color:var(--mut);font-weight:700;letter-spacing:3px;font-size:11px;text-align:center;margin:26px 0 2px}
.row{display:block;margin-top:10px;padding:14px 16px 13px;transition:transform .15s,border-color .2s}.row:hover,.proof:hover{border-color:#68E1FF55}
.rt{display:flex;justify-content:space-between;align-items:center;gap:10px}.rl{min-width:0;flex:1}
.rteams{font-weight:700;font-size:17px;letter-spacing:-.3px;line-height:1.2}.rteams em{font-style:normal;color:var(--mut);font-size:10px;font-weight:500;margin:0 5px}
.rpick{color:var(--mut);font-size:13px;margin-top:1px}.rp{text-align:right;flex:none}.rpct{font-weight:700;font-size:30px;line-height:1;letter-spacing:-1px}.rlab{font-weight:700;font-size:9px;letter-spacing:1.6px;margin-top:3px}
.ms{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:var(--mut)}.ms b{color:var(--text);margin-left:3px}
.cta{text-align:center;margin-top:34px}.cta h2{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.btn{display:block;margin-top:14px;background:var(--cyan);color:#04121F;font-weight:700;font-size:16px;padding:16px 10px;border-radius:15px;text-align:center;box-shadow:0 0 36px -4px var(--cyan),0 0 0 3px #68E1FF33}.btn:active{transform:scale(.98)}
.notes{text-align:center;color:var(--mut);font-size:10.5px;line-height:1.7;margin-top:20px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(3,9,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#0f1d31;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(104,225,255,.35)}
.ov.on .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.x{position:sticky;float:right;top:0;width:34px;height:34px;border-radius:50%;background:#16273D;color:var(--mut);font-size:16px;text-align:center;line-height:34px;margin-left:8px}
